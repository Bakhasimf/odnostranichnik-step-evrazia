<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Все публикации — Степная Евразия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Spectral:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=22" />
  </head>
  <body class="page-sub" data-list-page="publications">
    <header class="site-header site-header--sub" id="siteHeader">
      <div class="container nav-wrap">
        <a href="index.html" class="brand"><span class="brand-title" style="font-family:var(--font-serif);font-size:26px;font-weight:600">Степная Евразия</span></a>
        <nav class="nav nav--sub"><a href="index.html">На главную</a></nav>
      </div>
    </header>
    <main class="sub-main">
      <section class="section page-list-pubs-section">
        <div class="container page-list-pubs">
          <h1 class="detail-title" style="margin-bottom:28px">Все публикации и материалы</h1>

          <div class="news-list-search-wrap reveal" role="search">
            <input
              type="search"
              id="pubListSearch"
              class="news-list-search-input"
              placeholder="Поиск по названию, описанию, типу…"
              autocomplete="off"
              aria-label="Поиск по публикациям"
            />
          </div>
          <p id="pubSearchNoResults" class="detail-muted news-search-empty is-hidden" role="status">
            Информация не найдена.
          </p>

          <div class="filters pub-filters reveal" role="tablist" aria-label="Фильтр публикаций">
            <button type="button" class="filter is-active" data-filter="all">Все</button>
            <button type="button" class="filter" data-filter="Монография">Монографии</button>
            <button type="button" class="filter" data-filter="Статья">Статьи</button>
            <button type="button" class="filter" data-filter="Сборник">Сборники</button>
            <button type="button" class="filter" data-filter="Журнал">Журналы</button>
            <button type="button" class="filter" data-filter="Отчет">Отчеты</button>
            <button type="button" class="filter" data-filter="Видео">Видео</button>
          </div>

          <div id="listRoot"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-bottom">
        <p>© Академия наук Республики Татарстан, 2026. Все права защищены. <span class="footer-credit"></span></p>
      </div>
    </footer>
    <script src="site-data.js?v=2"></script>
    <script src="list-all.js?v=9"></script>
  </body>
</html>
